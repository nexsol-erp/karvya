# Shared proxy settings for everything forwarded to the backend.
#
# The Host header matters more than it looks. Without setting it explicitly,
# nginx sends the upstream's name - and an upstream named with an underscore
# produces `Host: karvya_backend`, which is not a valid hostname. Tomcat
# rejects the request with a bare 400 that looks like an application fault.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# The application reads only the first entry, which is the one nginx controls;
# anything beyond it was supplied by the client and is not trusted.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
