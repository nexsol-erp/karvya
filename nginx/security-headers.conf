# Security headers, as an include rather than a server-level block.
#
# nginx's add_header does not merge: a location that declares ANY add_header
# discards every one inherited from its parent. Setting these once on `server`
# therefore removes them from exactly the locations that set a Cache-Control,
# which is most of them - and does so silently. Including this file in each
# location is the only reliable way to have them present everywhere.
#
# HSTS is deliberately absent. It belongs on whatever terminates TLS in front
# of this container; sent over plain HTTP it is ignored, and setting it here
# would give a false sense that it is handled.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The app loads fonts from Google and nothing else external. 'unsafe-inline'
# for styles is required by MUI's runtime style injection - a real weakening,
# and moving to a nonce is the next improvement worth making.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
