<div th:replace="~{email/_layout :: shell('Reset your password', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;">
      Hello <span th:text="${fullName}">there</span>, we received a request to
      reset the password on your account.
    </p>

    <p style="margin:0 0 20px;">
      <a th:href="${resetUrl}"
         style="display:inline-block;background:#A33B2E;color:#FFFFFF;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:600;font-size:15px;">
        Choose a new password
      </a>
    </p>

    <p style="margin:0 0 14px;font-size:13px;color:#6B6357;">
      This link can be used once, and expires
      <span th:text="${expiresAt}">shortly</span>.
    </p>

    <p style="margin:0;font-size:13px;color:#6B6357;">
      If you did not ask for this, nothing has changed and you can ignore this
      message. Your password stays as it is.
    </p>
  </div>
</div>
