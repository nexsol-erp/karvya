<div th:replace="~{email/_layout :: shell('Thank you for your order', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;">
      Hello <span th:text="${customerName}">customer</span>, we have your order.
    </p>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="background:#F0E7D8;border-radius:8px;margin:0 0 18px;">
      <tr>
        <td style="padding:14px 16px;font-family:Helvetica,Arial,sans-serif;">
          <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6357;">
            Order number
          </div>
          <div style="font-size:20px;font-weight:700;color:#A33B2E;font-family:monospace;"
               th:text="${orderNumber}">KV-000000-XXXX</div>
        </td>
      </tr>
    </table>

    <p style="margin:0 0 6px;">
      <strong th:text="${itemCount}">0</strong> item(s) &middot;
      <strong th:text="|${currency} ${total}|">INR 0</strong>
    </p>
    <p style="margin:0 0 18px;">
      Paying by <strong th:text="${paymentMethod}">method</strong>
    </p>

    <div th:if="${paymentInstructions}"
         style="background:#FFFFFF;border:1px solid #E0D4C0;border-left:3px solid #4C5B47;border-radius:6px;padding:12px 14px;margin:0 0 18px;">
      <div style="font-size:13px;color:#6B6357;margin-bottom:4px;">Payment instructions</div>
      <div th:text="${paymentInstructions}">instructions</div>
    </div>

    <p style="margin:0;padding:12px 14px;background:#FFFFFF;border:1px solid #E0D4C0;border-radius:6px;">
      Your order will be confirmed by our team. Payment instructions will be
      shared separately.
    </p>
  </div>
</div>
