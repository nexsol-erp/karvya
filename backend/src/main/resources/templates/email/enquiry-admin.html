<div th:replace="~{email/_layout :: shell('New enquiry', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;">Someone has sent a message through the contact form.</p>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="border:1px solid #E0D4C0;border-radius:8px;margin:0 0 18px;">
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">From</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;text-align:right;"
            th:text="${name}">name</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">Email</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;text-align:right;"
            th:text="${email}">email</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;font-size:14px;">Subject</td>
        <td style="padding:10px 14px;font-size:14px;text-align:right;"
            th:text="${subjectLine}">subject</td>
      </tr>
    </table>

    <div style="background:#FFFFFF;border:1px solid #E0D4C0;border-radius:6px;padding:14px;white-space:pre-wrap;"
         th:text="${message}">message</div>
  </div>
</div>
