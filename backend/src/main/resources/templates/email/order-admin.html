<div th:replace="~{email/_layout :: shell('New order received', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;">A new order has come in and is waiting for review.</p>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="border:1px solid #E0D4C0;border-radius:8px;margin:0 0 18px;">
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">Order</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;font-family:monospace;font-weight:700;text-align:right;"
            th:text="${orderNumber}">KV-000000-XXXX</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">Customer</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;text-align:right;"
            th:text="${customerName}">name</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">Items</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;text-align:right;"
            th:text="${itemCount}">0</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;">Payment</td>
        <td style="padding:10px 14px;border-bottom:1px solid #E0D4C0;font-size:14px;text-align:right;"
            th:text="${paymentMethod}">method</td>
      </tr>
      <tr>
        <td style="padding:10px 14px;font-size:15px;font-weight:700;">Total</td>
        <td style="padding:10px 14px;font-size:15px;font-weight:700;text-align:right;color:#A33B2E;"
            th:text="|${currency} ${total}|">INR 0</td>
      </tr>
    </table>

    <p style="margin:0;font-size:14px;color:#6B6357;">
      Open the admin area to confirm this order and record payment.
    </p>
  </div>
</div>
